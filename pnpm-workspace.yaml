packages:
  - "apps/*"
  - "packages/*"
  - "functions"

allowBuilds:
  '@firebase/util': set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false

# pnpm 11+: pacotes cujos scripts de install/build podem rodar
onlyBuiltDependencies:
  - sharp
  - esbuild
  - "@firebase/util"
  - protobufjs
